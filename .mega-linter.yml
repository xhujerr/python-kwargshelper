---
# Configuration file for MegaLinter
# See all available variables at https://oxsecurity.github.io/megalinter/configuration/ and in linters documentation

APPLY_FIXES: none # all, none, or list of linter keys
# ENABLE: # If you use ENABLE variable, all other languages/formats/tooling-formats will be disabled by default
# ENABLE_LINTERS: # If you use ENABLE_LINTERS variable, all other linters will be disabled by default
DISABLE:
  # - COPYPASTE # Uncomment to disable checks of excessive copy-pastes
  - SPELL # Uncomment to disable checks of spelling mistakes
  # - ACTION
  # - JSON
  # - REPOSITORY_DEVSKIM
  # - DEVSKIM
DISABLE_LINTERS:
  - REPOSITORY_DEVSKIM
  # - DEVSKIM
  # - REPOSITORY_SEMGREP
  - REPOSITORY_KICS
  - REPOSITORY_CHECKOV
  - REPOSITORY_TRIVY
  - REPOSITORY_GITLEAKS
  - RST_RSTFMT # Very early stage of development. Doesn't support Sphinx.
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
# DISABLE_ERRORS: true # Uncomment if you want MegaLinter to detect errors but not block CI to pass
PYTHON_RUFF_POST_COMMANDS:
  - command: "ruff clean"
REPOSITORY_SECRETLINT_CONFIG_FILE: .secretlintrc.yaml
MARKDOWN_SUMMARY_REPORTER: true
SARIF_REPORTER: true
BASH_EXEC_FILTER_REGEX_EXCLUDE: (doc|tests)
CSS_STYLELINT_FILTER_REGEX_EXCLUDE: (docs|tests)
JAVASCRIPT_STANDARD_FILTER_REGEX_EXCLUDE: (docs|test)
HTML_HTMLHINT_FILTER_REGEX_EXCLUDE: (docs|tests)
HTML_DJLINT_FILTER_REGEX_EXCLUDE: (docs|tests)
EDITORCONFIG_EDITORCONFIG_CHECKER_FILTER_REGEX_EXCLUDE: (docs|tests)
RST_RST_LINT_FILTER_REGEX_EXCLUDE: (docs|tests) # rst-lint doesn't know how to check sphinx files.
REPOSITORY_KINGFISHER_ARGUMENTS: "--skip-regex '.*' .git/"
